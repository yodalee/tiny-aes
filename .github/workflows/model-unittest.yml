name: Model unit tests

on:
  push:
    paths:
      - "model/**"
      - "requirements.txt"
      - ".github/workflows/model-unittest.yml"
  pull_request:
    paths:
      - "model/**"
      - "requirements.txt"
      - ".github/workflows/model-unittest.yml"

permissions:
  contents: read

jobs:
  unittest:
    name: Python model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run model unit tests
        run: python -m unittest model/gf2.py model/sbox.py
