name: Cocotb simulation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulation:
    name: Cocotb simulation (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MixColumn
            target: sim-mixcolumn
          - name: Sbox LUT
            target: sim-sbox
          - name: Sbox Arish
            target: sim-sbox-arish
          - name: Sbox Canright
            target: sim-sbox-canright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up latest Verilator
        uses: veryl-lang/setup-verilator@v1

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run ${{ matrix.name }} simulation
        run: make ${{ matrix.target }}
