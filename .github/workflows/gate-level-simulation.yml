name: Gate-level simulation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate-level:
    name: Synthesized AesTop simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install synthesis and simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog yosys

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Synthesize AesTop
        run: make synth

      - name: Run gate-level AesTop simulation
        run: make sim-aestop-synth
