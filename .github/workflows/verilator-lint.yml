name: Verilator lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --yes verilator

      - name: Lint RTL
        run: >-
          verilator --lint-only
          $(find src/rtl -type f \( -name '*.v' -o -name '*.sv' \) -print)
